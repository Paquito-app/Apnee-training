<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0A0D12">
<title>Apnée Training</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Apnée">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
  <div class="brand">
    <h1>Apnée Training</h1>
    <span>Chrono d'entraînement</span>
  </div>
  <div class="tabs" id="tabs">
    <button class="tab" data-protocol="carre">Respiration<span class="sub">carrée</span></button>
    <button class="tab" data-protocol="o2">Table<span class="sub">O2</span></button>
    <button class="tab" data-protocol="co2">Table<span class="sub">CO2</span></button>
    <button class="tab" data-protocol="hiit">HIIT<span class="sub">Cardio</span></button>
    <button class="tab" data-protocol="chrono">Chrono<span class="sub">Libre</span></button>
  </div>
</header>

<main>
  <div id="setup"></div>

  <div id="run">
    <div class="round-badge" id="roundBadge">ROUND 1 / 8</div>
    <div class="breath-phase-label mono" id="breathPhaseLabel" hidden></div>
    <div class="ring-wrap">
      <svg class="ring-svg" id="clockSvg" viewBox="0 0 200 200">
        <path id="sessionArc" class="session-fg" stroke="var(--rest)"></path>
        <circle id="sessionDot" class="session-dot" cx="100" cy="2" r="3.5" fill="var(--rest)"></circle>
        <path id="pieSector" class="pie-sector" fill="var(--rest)"></path>
        <defs>
          <clipPath id="clockSweptClip"><path id="clockSweptClipPath"></path></clipPath>
          <clipPath id="clockUnsweptClip" clip-rule="evenodd"><path id="clockUnsweptClipPath"></path></clipPath>
        </defs>
        <g id="clockDigitFade">
          <g clip-path="url(#clockUnsweptClip)">
            <text id="digitUnswept" class="clock-digit-svg" x="100" y="112" text-anchor="middle" fill="var(--rest)">60</text>
          </g>
          <g clip-path="url(#clockSweptClip)">
            <text id="digitSwept" class="clock-digit-svg" x="100" y="112" text-anchor="middle" fill="var(--bg)">60</text>
          </g>
          <g id="clockSecGroup">
            <g clip-path="url(#clockUnsweptClip)">
              <text id="secLabelUnswept" class="sec-label-svg" x="100" y="140" text-anchor="middle" fill="var(--rest)">secondes</text>
            </g>
            <g clip-path="url(#clockSweptClip)">
              <text id="secLabelSwept" class="sec-label-svg" x="100" y="140" text-anchor="middle" fill="var(--bg)">secondes</text>
            </g>
          </g>
        </g>
        <g id="minorTicks"></g>
        <g id="posMarks"></g>
      </svg>
      <svg class="breath-svg" id="breathSvg" viewBox="0 0 200 200" style="display:none">
        <defs>
          <clipPath id="circleClip">
            <circle cx="100" cy="100" r="88"></circle>
          </clipPath>
          <clipPath id="aboveClip">
            <rect id="aboveRect" x="0" y="0" width="200" height="100"></rect>
          </clipPath>
          <clipPath id="belowClip">
            <rect id="belowRect" x="0" y="100" width="200" height="100"></rect>
          </clipPath>
        </defs>
        <circle class="ring-bg" cx="100" cy="100" r="88"></circle>
        <g clip-path="url(#circleClip)">
          <g id="waterY">
            <g class="water-wave">
              <path id="waterFill" fill="var(--rest)" d="M-50,0 C-25,-5 -25,5 0,0 C25,-5 25,5 50,0 C75,-5 75,5 100,0 C125,-5 125,5 150,0 C175,-5 175,5 200,0 C225,-5 225,5 250,0 L250,200 L-50,200 Z"></path>
            </g>
          </g>
          <g clip-path="url(#aboveClip)">
            <text id="digitAbove" class="breath-digit-svg" x="100" y="118" text-anchor="middle" style="fill:var(--rest)">0</text>
            <text id="secLabelAbove" class="sec-label-svg" x="100" y="142" text-anchor="middle" style="fill:var(--rest)">secondes</text>
          </g>
          <g clip-path="url(#belowClip)">
            <text id="digitBelow" class="breath-digit-svg" x="100" y="118" text-anchor="middle" style="fill:#0A0D12">0</text>
            <text id="secLabelBelow" class="sec-label-svg" x="100" y="142" text-anchor="middle" style="fill:#0A0D12">secondes</text>
          </g>
        </g>
      </svg>
      <div class="ring-center">
        <div class="phase-unit" id="phaseUnit" hidden>secondes</div>
      </div>
    </div>
    <div class="controls">
      <button class="ctrl-btn primary" id="pauseBtn">Stop</button>
    </div>
  </div>

  <div id="done">
    <img id="doneLogo" alt="" src="img/plongeur-carre.png">
    <img id="doneCO2" alt="" src="img/plongeur-co2.png">
    <img id="doneO2" alt="" src="img/plongeur-o2.png">
    <img id="doneDiver" class="done-diver" alt="" src="img/plongeur-hiit.png">
    <h2 id="doneTitle">Séance terminée</h2>
    <p id="doneSummary"></p>
    <div class="controls" style="max-width:260px;margin-top:8px;">
      <button class="ctrl-btn primary" id="doneBackBtn">Retour</button>
    </div>
  </div>

  <div id="chrono">
    <div class="chr-dial">
      <svg viewBox="0 0 400 400" role="img" aria-label="Cadran du chronomètre">
        <defs><clipPath id="chrSweepClip"><path id="chrSweepPath" d=""/></clipPath></defs>
        <g id="chrTicks"></g>
        <g id="chrNums"></g>
        <g id="chrNumsBlue" clip-path="url(#chrSweepClip)"></g>
        <g id="chrMinMarks"></g>
        <image href="img/plongeur-co2.png" x="170.93" y="115" width="58.14" height="170"/>
        <g id="chrHand" transform="rotate(0 200 200)">
          <line class="chr-hand" x1="200" y1="234" x2="200" y2="8" stroke-width="3.6"/>
          <circle cx="200" cy="200" r="7" fill="#0A0D12" stroke="#35A7FF" stroke-width="3"/>
        </g>
      </svg>
    </div>
    <button type="button" class="chr-btn chr-go" id="chrGoBtn">GO</button>
    <div class="chr-result" id="chrResult" aria-live="polite"></div>
    <div class="chr-bip">
      <div class="chr-chips" id="chrChips"></div>
      <div class="chr-bip-row">
        <span class="chr-bip-label">Bip à</span>
        <input id="chrAddMin" type="number" inputmode="numeric" min="0" max="99" placeholder="min" aria-label="Minutes du bip">
        <span class="chr-colon">:</span>
        <input id="chrAddSec" type="number" inputmode="numeric" min="0" max="59" placeholder="sec" aria-label="Secondes du bip">
        <button type="button" class="chr-bip-add" id="chrAddBtn">Ajouter</button>
      </div>
    </div>
    <div class="chr-best"><span id="chrBest"></span><button type="button" class="chr-link" id="chrEditBtn">Définir</button></div>
    <div class="chr-edit" id="chrEdit" hidden>
      <div class="chr-edit-row">
        <input id="chrMin" type="number" inputmode="numeric" min="0" max="99" placeholder="min" aria-label="Minutes du record">
        <span class="chr-colon">:</span>
        <input id="chrSec" type="number" inputmode="numeric" min="0" max="59" placeholder="sec" aria-label="Secondes du record">
        <input id="chrDate" type="date" aria-label="Date du record">
      </div>
      <div class="chr-edit-row">
        <button type="button" class="chr-save" id="chrSave">Enregistrer</button>
        <button type="button" class="chr-cancel" id="chrCancel">Annuler</button>
      </div>
    </div>
  </div>
</main>

<script src="js/voices.js"></script>
<script src="js/audio.js"></script>
<script src="js/app.js"></script>
<script src="js/chrono.js"></script>
<script>
  // Mode hors-ligne (uniquement quand l'app est servie en ligne, pas en ouvrant le fichier directement)
  if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  }
</script>
</body>
</html>
