  body[data-bg="navy"]{--bg-image:linear-gradient(180deg,#16213f 0%,#0f172d 100%);}
  .mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums;}

  /* ---- header ---- */
  header{
    padding-block:18px 12px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .brand h1{
    font-size:19px;
    font-weight:800;
    letter-spacing:.01em;
    margin:0;
  }
  .brand span{
    color:var(--muted);
    font-size:12px;
    font-weight:600;
  }
  .tabs{
    display:grid;
    grid-template-columns:1.6fr 1fr 1fr 1fr 1fr;
    gap:6px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:14px;
    padding:4px;
  }
  .tab{
    appearance:none;
    border:0;
    background:transparent;
    color:var(--muted);
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    letter-spacing:0;
    padding:10px 2px;
    border-radius:10px;
    cursor:pointer;
    transition:background .15s ease, color .15s ease;
  }
  .tab.active{
    background:var(--surface-2);
    color:var(--text);
  }
  .tab .sub{
    display:block;
    font-weight:500;
    color:var(--muted);
    font-size:10.5px;
    margin-top:2px;
  }
  .tab.active .sub{color:var(--muted);}

  main{
    flex:1;
    display:flex;
    flex-direction:column;
    min-height:0;
    padding-block:4px 18px;
  }

  /* ---- setup screen ---- */
  #setup{display:flex;flex-direction:column;gap:16px;overflow-y:auto;}
  .field-group{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:16px;
    padding:14px 14px 6px;
  }
  .field{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-block:10px;
    border-bottom:1px solid var(--border);
  }
  .field:last-child{border-bottom:0;}
  .field-label{font-size:13.5px;font-weight:600;color:var(--text);}
  .field-hint{font-size:11px;color:var(--muted);margin-top:1px;}
  .stepper{
    display:flex;
    align-items:center;
    gap:10px;
    flex-shrink:0;
  }
  .stepper button{
    width:30px;height:30px;
    border-radius:9px;
    border:1px solid var(--border);
    background:var(--surface-2);
    color:var(--text);
    font-size:17px;
    font-weight:700;
    line-height:1;
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
  }
  .stepper button:active{background:#242D39;}
  .stepper .val{
    min-width:56px;
    text-align:center;
    font-size:15px;
    font-weight:700;
  }
  .preview{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:14px 16px;
    background:var(--surface-2);
    border-radius:14px;
    font-size:12.5px;
    color:var(--muted);
  }
  .preview b{color:var(--text);font-size:14px;}
  .presets{display:flex;flex-direction:column;gap:10px;}
  .presets button{appearance:none;font-family:inherit;cursor:pointer;}
  .preset-row{display:flex;align-items:center;gap:8px;}
  .preset-open{flex:1;text-align:left;padding:10px 0;border:0;background:none;color:#fff;font-size:18px;font-weight:500;}
  .preset-del{width:40px;border:0;background:none;color:var(--ready);font-size:16px;}
  .plus-btn{align-self:center;background:none;border:0;padding:0 24px;color:var(--effort);font-size:88px;font-weight:400;line-height:1;margin-top:6px;}
  .setup-top{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .back-link{appearance:none;background:none;border:0;padding:4px 0;font-family:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;}
  .setup-name{font-size:15px;font-weight:700;color:var(--text);}
  .name-inp{font-family:inherit;font-size:16px;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px;min-width:0;}
  .name-inp:focus{outline:0;border-color:var(--text);}
  .start-btn{
    appearance:none;
    border:0;
    border-radius:16px;
    padding:17px 34px;
    align-self:center;
    font-family:inherit;
    font-size:15.5px;
    font-weight:800;
    letter-spacing:.02em;
    color:var(--effort);
    background:none;
    cursor:pointer;
    margin-top:auto;
  }
  .start-btn:active{opacity:.85;}

  /* ---- run screen ---- */
  #run{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:20px;
  }
  #run.active{display:flex;}
  #setup.hidden{display:none;}

  .round-badge{
    font-size:12.5px;
    font-weight:700;
    color:var(--muted);
    letter-spacing:.03em;
  }
  .ring-wrap{position:relative;width:min(78vw,300px);height:min(78vw,300px);}
  .ring-wrap svg{position:absolute;inset:0;width:100%;height:100%;}
  .session-track{fill:none;stroke:none;}
  .session-fg{fill:none;stroke-width:3;stroke-linecap:round;transition:stroke .25s ease;}
  .session-dot{transition:fill .25s ease;}
  .clock-face{fill:none;}
  .pie-sector{transition:fill .25s ease;}
  .minor-dot{fill:var(--border);}
  .pos-dot{fill:#fff;}
  .pos-num{font-family:'Baloo 2','Onest',sans-serif;font-weight:800;}
  .clock-digit-svg{font-family:'Baloo 2','Onest',sans-serif;font-weight:800;font-size:76px;transition:fill-opacity .2s linear;}
  .sec-label-svg{font-family:'Onest',sans-serif;font-weight:700;font-size:11px;letter-spacing:.04em;text-transform:lowercase;}
  .breath-svg .ring-bg{fill:none;stroke:none;}
  .water-wave{animation:waterDrift 2.4s linear infinite;}
  @keyframes waterDrift{from{transform:translateX(0)}to{transform:translateX(-50px)}}
  .ring-center{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:6px;
  }
  .phase-label{
    display:none;
  }
  .breath-phase-label{
    font-size:13px;
    font-weight:800;
    letter-spacing:.06em;
    text-transform:uppercase;
    text-align:center;
    margin-bottom:4px;
    transition:color .25s ease;
  }
  .phase-time{display:none;}
  .breath-digit-svg{
    font-family:'Baloo 2', 'Onest', sans-serif;
    font-weight:700;
    font-size:100px;
  }
  .next-up{display:none;}
  .phase-unit{
    font-size:12px;
    font-weight:700;
    letter-spacing:.04em;
    text-transform:lowercase;
    color:var(--muted);
    margin-top:78px;
  }

  .controls{
    display:flex;
    gap:12px;
    width:100%;
    max-width:340px;
    justify-content:center;
  }
  .ctrl-btn{
    flex:none;
    appearance:none;
    border:1px solid var(--border);
    background:var(--surface);
    color:var(--text);
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    padding:15px 30px;
    border-radius:14px;
    cursor:pointer;
  }
  .ctrl-btn.primary{
    background:none;
    color:var(--effort);
    border-color:transparent;
  }
  .ctrl-btn.ghost{color:var(--muted);}
  .ctrl-btn:active{opacity:.8;}

  /* ---- done screen ---- */
  #done{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:14px;
    text-align:center;
  }
  #done.active{display:flex;}
  #doneCO2{display:none;height:242px;width:auto;max-width:100%;}
  #doneO2{display:none;width:min(340px,100%);height:auto;}
  #doneLogo{display:none;height:242px;width:auto;max-width:100%;}
  .done-diver{width:200px;max-width:100%;height:auto;display:block;}
  #done h2{margin:0;font-size:19px;font-weight:800;}
  #done p{margin:0;color:var(--muted);font-size:13px;}

  @media (max-width:360px){
    .phase-time{font-size:46px;}
  }

  /* ---- chrono libre ---- */
  #chrono{
    display:none;
    flex:1;
    flex-direction:column;
    align-items:center;
    gap:28px;
    overflow-y:auto;
    padding-block:8px 24px;
    --chr-tick:#5C6470;
  }
  #chrono.active{display:flex;}
  .chr-dial{aspect-ratio:1;width:min(100%,360px);flex-shrink:0;}
  .chr-dial svg{width:100%;height:100%;display:block;}
  .chr-t-fine{stroke:var(--chr-tick);stroke-width:1.1;}
  .chr-t-sec{stroke:var(--chr-tick);stroke-width:1.8;}
  .chr-t-major{stroke:var(--text);stroke-width:3.4;}
  .chr-n-main{fill:var(--text);font-family:'Baloo 2','Onest',sans-serif;font-size:36px;font-weight:700;text-anchor:middle;}
  #chrNumsBlue text{fill:var(--rest);}
  .chr-min-dot{fill:#FFFFFF;}
  .chr-min-num{fill:var(--ready);font-family:'Baloo 2','Onest',sans-serif;font-size:26px;font-weight:800;text-anchor:middle;}
  .chr-hand{stroke:var(--rest);stroke-linecap:round;}
  .chr-btn{
    appearance:none;background:none;border:0;padding:12px 28px;
    font-family:'Onest',sans-serif;font-size:26px;font-weight:800;letter-spacing:.08em;line-height:1;
    cursor:pointer;color:var(--text);
  }
  .chr-btn.chr-go{color:var(--rest);}
  .chr-btn:active{opacity:.6;}
  .chr-btn:focus-visible{outline:2px solid var(--text);outline-offset:4px;}
  .chr-result{
    min-height:48px;font-family:'Baloo 2','Onest',sans-serif;font-size:44px;font-weight:800;line-height:1;
    font-variant-numeric:tabular-nums;color:var(--text);
  }
  .chr-best{font-size:14px;font-weight:500;color:var(--muted);text-align:center;}

  .chr-link{appearance:none;background:none;border:0;padding:0 0 0 8px;font:inherit;color:var(--rest);cursor:pointer;text-decoration:underline;}
  .chr-edit{
    display:flex;flex-direction:column;gap:12px;width:min(100%,360px);
    background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px;
    margin-top:-6px;
  }
  .chr-edit-row{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;}
  .chr-edit input{
    font-family:'Onest',sans-serif;font-size:16px;color:var(--text);
    background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:10px;
    width:76px;min-width:0;text-align:center;color-scheme:dark;
  }
  .chr-edit input[type="date"]{width:160px;}
  .chr-colon{font-size:20px;font-weight:800;color:var(--muted);}
  .chr-edit button{
    appearance:none;font-family:'Onest',sans-serif;font-size:14px;font-weight:700;cursor:pointer;
    border-radius:10px;padding:10px 16px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted);
  }
  .chr-edit button.chr-save{background:var(--rest);color:#101418;border-color:transparent;}
  .chr-edit input:focus-visible,.chr-edit button:focus-visible,.chr-link:focus-visible{outline:2px solid var(--text);outline-offset:2px;}

  .chr-rec{font-weight:600;color:var(--text);}
  .chr-bip{margin-top:-14px;display:flex;flex-direction:column;align-items:center;gap:8px;}
  .chr-bip-row{display:flex;align-items:center;justify-content:center;gap:8px;}
  .chr-bip-label{color:var(--muted);font-size:14px;}
  .chr-bip input{
    font-family:'Onest',sans-serif;font-size:16px;color:var(--text);background:transparent;
    border:0;border-bottom:1px solid var(--border);border-radius:0;padding:6px 0;
    width:48px;min-width:0;text-align:center;
  }
  .chr-bip input:focus{outline:0;border-bottom-color:var(--text);}
  .chr-bip button{appearance:none;background:none;border:0;font-family:'Onest',sans-serif;cursor:pointer;padding:6px 4px;}
  .chr-bip-add{color:var(--rest);font-size:14px;font-weight:700;}
  .chr-chips{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;}
  .chr-bip button.chr-chip{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;}
  .chr-bip button:focus-visible{outline:2px solid var(--text);outline-offset:2px;}
</style>

<script>
(function(){
  "use strict";

  // ---------- storage helpers ----------
  function loadJSON(key, fallback){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fallback; }
    catch(e){ return fallback; }
  }
  function saveJSON(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){}
  }

  // ---------- protocol definitions ----------
  var PROTOCOLS = {
    co2: {
      name: "Table CO2",
      holdLabel: "APNÉE",
      kind: "apnea",
      fields: [
        {key:"breathSec", label:"Préparation", hint:"Avant le premier round", step:5, min:15, max:300, default:60},
        {key:"holdSec", label:"Temps d'apnée", hint:"Durée fixe à chaque round", step:5, min:15, max:600, default:90},
        {key:"restStart", label:"Temps de repos initial", hint:"Premier repos, diminue à chaque round", step:5, min:15, max:600, default:120},
        {key:"restStep", label:"Diminution du temps de repos", hint:"Par round, jusqu'à 0:05 minimum", step:5, min:5, max:60, default:15},
        {key:"recSec", label:"Temps de récupération", hint:"Après la dernière apnée", step:5, min:5, max:300, default:60},
        {key:"rounds", label:"Rounds", hint:"Nombre de répétitions", step:1, min:1, max:20, default:8, isRounds:true}
      ],
      build: function(cfg){
        var seq = [{type:"breathPrep", dur:cfg.breathSec, round:0}];
        for(var i=0;i<cfg.rounds;i++){
          seq.push({type:"hold", dur:cfg.holdSec, round:i+1});
          var rest = cfg.restStart - i*cfg.restStep;
          if(rest < 5) rest = 5;
          if(i < cfg.rounds-1) seq.push({type:"rest", dur:rest, round:i+1});
        }
        seq.push({type:"recovery", dur:cfg.recSec, round:cfg.rounds});
        return seq;
      }
    },
    o2: {
      name: "Table O2",
      holdLabel: "APNÉE",
      kind: "apnea",
      fields: [
        {key:"breathSec", label:"Préparation", hint:"Avant le premier round", step:5, min:15, max:300, default:60},
        {key:"holdStart", label:"Durée apnée initiale", hint:"Première apnée", step:5, min:15, max:600, default:60},
        {key:"holdStep", label:"Augmentation temps d'apnée", hint:"Ajout à chaque round", step:5, min:5, max:60, default:15},
        {key:"restSec", label:"Temps de repos", hint:"Entre chaque apnée", step:5, min:15, max:600, default:120},
        {key:"recSec", label:"Temps de récupération", hint:"Après la dernière apnée", step:5, min:5, max:300, default:60},
        {key:"rounds", label:"Rounds", hint:"Nombre de répétitions", step:1, min:1, max:20, default:8, isRounds:true}
      ],
      build: function(cfg){
        var seq = [{type:"breathPrep", dur:cfg.breathSec, round:0}];
        for(var i=0;i<cfg.rounds;i++){
          var hold = cfg.holdStart + i*cfg.holdStep;
          seq.push({type:"hold", dur:hold, round:i+1});
          if(i < cfg.rounds-1) seq.push({type:"rest", dur:cfg.restSec, round:i+1});
        }
        seq.push({type:"recovery", dur:cfg.recSec, round:cfg.rounds});
        return seq;
      }
    },
    carre: {
      name: "Respiration carrée",
      kind: "breath",
      fields: [
        {key:"inspi", label:"Inspiration", hint:"Durée de l'inspiration", step:1, min:1, max:60, default:4},
        {key:"hold1", label:"Rétention (poumons pleins)", hint:"0 = étape désactivée", step:1, min:0, max:60, default:4},
        {key:"expi", label:"Expiration", hint:"Durée de l'expiration", step:1, min:1, max:60, default:4},
        {key:"hold2", label:"Rétention (poumons vides)", hint:"0 = étape désactivée", step:1, min:0, max:60, default:4},
        {key:"rounds", label:"Cycles", hint:"Nombre de répétitions", step:1, min:1, max:50, default:6, isRounds:true}
      ],
      build: function(cfg){
        var seq = [];
        for(var i=0;i<cfg.rounds;i++){
          seq.push({type:"in", dur:cfg.inspi, round:i+1});
          if(cfg.hold1 > 0) seq.push({type:"holdFull", dur:cfg.hold1, round:i+1});
          seq.push({type:"out", dur:cfg.expi, round:i+1});
          if(cfg.hold2 > 0) seq.push({type:"holdEmpty", dur:cfg.hold2, round:i+1});
        }
        return seq;
      }
    },
    hiit: {
      name: "HIIT classique",
      holdLabel: "EFFORT",
      kind: "cardio",
      fields: [
        {key:"holdSec", label:"Effort", hint:"Durée d'intensité par round", step:5, min:5, max:300, default:30},
        {key:"restSec", label:"Repos", hint:"Récupération entre les rounds", step:5, min:5, max:300, default:30},
        {key:"rounds", label:"Rounds", hint:"Nombre de répétitions", step:1, min:2, max:30, default:8, isRounds:true}
      ],
      build: function(cfg){
        var seq = [];
        for(var i=0;i<cfg.rounds;i++){
          seq.push({type:"hold", dur:cfg.holdSec, round:i+1});
          if(i < cfg.rounds-1) seq.push({type:"rest", dur:cfg.restSec, round:i+1});
        }
        return seq;
      }
    }
  };

  var PREPARE_SEC = 5;

  var state = {
    protocol: loadJSON("scc_lastProtocol", "co2"),
    configs: loadJSON("scc_configs", {}),
    presets: loadJSON("scc_presets", {}),
    view: "list",
    cur: -1,
    sequence: [],
    idx: -1,
    phaseStart: 0,
    phaseDur: 0,
    remaining: 0,
    running: false,
    totalRounds: 0,
    raf: null,
    wakeLock: null
  };

  // fill missing config defaults
  Object.keys(PROTOCOLS).forEach(function(key){
    var cfg = state.configs[key] || {};
    PROTOCOLS[key].fields.forEach(function(f){
      if(typeof cfg[f.key] !== "number") cfg[f.key] = f.default;
    });
    state.configs[key] = cfg;
  });

  // ---------- format helpers ----------
  function fmt(sec){
    sec = Math.max(0, Math.round(sec));
    var m = Math.floor(sec/60), s = sec%60;
    return m + ":" + (s<10?"0":"") + s;
  }

  // ---------- audio ----------
  var actx = null;
  function getCtx(){
    if(!actx){
      try{ actx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    return actx;
  }
  function beep(freq, dur, delay, gainVal){
    var ctx = getCtx();
    if(!ctx) return;
    var t0 = ctx.currentTime + (delay||0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainVal||0.2, t0+0.02);
    gain.gain.linearRampToValueAtTime(0, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }
  function buzz(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }
  function tickBeep(){ beep(880, 0.09, 0, 0.15); buzz(40); }
  function transitionBeep(){ beep(560, 0.28, 0, 0.22); buzz(100); }
  function beepExp(freq, dur, attack, gainVal){
    var ctx = getCtx();
    if(!ctx) return;
    var t0 = ctx.currentTime;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0, t0);
    gain.gain.linearRampToValueAtTime(gainVal, t0+attack);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain).connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0+dur+0.02);
  }
  function minuteBeep(){ beepExp(440, 0.28, 0.025, 0.24); buzz(150); }

  var voices = [];
  function loadVoices(){ try{ voices = speechSynthesis.getVoices(); }catch(e){} }
  if("speechSynthesis" in window){
    loadVoices();
    speechSynthesis.onvoiceschanged = loadVoices;
  }
  function speak(text){
    if(!("speechSynthesis" in window)) return;
    try{
      var u = new SpeechSynthesisUtterance(text);
      u.lang = "fr-FR";
      u.rate = 1;
      u.volume = 1;
      var frVoice = voices.find(function(v){ return v.lang && v.lang.toLowerCase().indexOf("fr") === 0; });
      if(frVoice) u.voice = frVoice;
      speechSynthesis.cancel();
      speechSynthesis.speak(u);
    }catch(e){}
  }

  // ---------- voix enregistrées ----------
  var VOICE_LEAD = 0.04; // s : chaque mot démarre 40 ms après le début de son fichier
  var VOICE_FALLBACK = {top:"Top", respirez:"Respirez"};
  var voiceBuf = {}, voiceLoading = false, voiceSrc = [];
  function b64ToBuf(b64){
    var bin = atob(b64), n = bin.length, u = new Uint8Array(n);
    for(var i=0;i<n;i++) u[i] = bin.charCodeAt(i);
    return u.buffer;
  }
  function loadVoiceBuffers(){
    var ctx = getCtx();
    if(!ctx || voiceLoading || typeof VOICE_DATA === "undefined") return;
    voiceLoading = true;
    try{ if(ctx.state === "suspended") ctx.resume(); }catch(e){}
    Object.keys(VOICE_DATA).forEach(function(k){
      try{
        var p = ctx.decodeAudioData(b64ToBuf(VOICE_DATA[k]), function(b){ voiceBuf[k] = b; }, function(){});
        if(p && p.catch) p.catch(function(){});
      }catch(e){}
    });
  }
  function playVoice(key){
    var ctx = getCtx(), b = voiceBuf[key];
    if(!ctx || !b){ speak(VOICE_FALLBACK[key] || key); return; }
    try{
      var src = ctx.createBufferSource();
      src.buffer = b;
      src.connect(ctx.destination);
      src.onended = function(){ voiceSrc = voiceSrc.filter(function(x){ return x !== src; }); };
      voiceSrc.push(src);
      src.start();
    }catch(e){}
  }
  function stopVoices(){
    voiceSrc.forEach(function(x){ try{ x.stop(); }catch(e){} });
    voiceSrc = [];
  }

  // ---------- wake lock ----------
  function requestWake(){
    if("wakeLock" in navigator){
      navigator.wakeLock.request("screen").then(function(wl){ state.wakeLock = wl; }).catch(function(){});
    }
  }
  function releaseWake(){
    if(state.wakeLock){ try{ state.wakeLock.release(); }catch(e){} state.wakeLock = null; }
  }

  // ---------- DOM refs ----------

    rest: "var(--ready)",
    breathPrep: "var(--effort)",
    recovery: "var(--effort)",
    "in": "var(--rest)",

  };

    "in": "INSPIRATION",

  };

  var MAX_R = 88;
  var waterFill = document.getElementById("waterFill");
  var waterY = document.getElementById("waterY");
  var aboveRect = document.getElementById("aboveRect");
  var belowRect = document.getElementById("belowRect");
  var digitAbove = document.getElementById("digitAbove");
  var digitBelow = document.getElementById("digitBelow");
  var phaseUnit = document.getElementById("phaseUnit");
  var breathSvg = document.getElementById("breathSvg");
  var clockSvg = document.getElementById("clockSvg");
  var pieSector = document.getElementById("pieSector");
  var sessionArc = document.getElementById("sessionArc");
  var sessionDot = document.getElementById("sessionDot");
  var minorTicksG = document.getElementById("minorTicks");
  var posMarksG = document.getElementById("posMarks");
  var digitUnsweptEl = document.getElementById("digitUnswept");

  var clockSecGroupEl = document.getElementById("clockSecGroup");
  var secLabelUnsweptEl = document.getElementById("secLabelUnswept");
  var secLabelSweptEl = document.getElementById("secLabelSwept");
  var secLabelAboveEl = document.getElementById("secLabelAbove");
  var secLabelBelowEl = document.getElementById("secLabelBelow");
  var clockSweptClipPathEl = document.getElementById("clockSweptClipPath");
  var clockUnsweptClipPathEl = document.getElementById("clockUnsweptClipPath");

  var FACE_R = 68;
  var MINOR_R_IN = 74;
  var MINOR_R_OUT = 79;
  var POS_R = 88;
  var SESSION_R = 98;

  function polarXY(angleDeg, radius){
    var rad = angleDeg * Math.PI / 180;
    return { x: 100 + radius * Math.sin(rad), y: 100 - radius * Math.cos(rad) };
  }

  // Full-circle path helper (two half-arcs, via proper antipodal top/bottom points) for radius r —
  // used when a sweep would be ~360deg.
  function fullCirclePath(r){
    return "M100," + (100 - r) +
           " A" + r + "," + r + " 0 1 1 100," + (100 + r) +
           " A" + r + "," + r + " 0 1 1 100," + (100 - r) + " Z";
  }

  // Filled pie sector: the ELAPSED portion of the current 60s lap, growing clockwise from the top.
  // frac=0 -> empty (start of a new minute). frac=1 -> full circle (a lap just completed).
  function pieWedgeD(frac, r){
    frac = Math.max(0, Math.min(1, frac));
    var deg = frac * 360;
    if(deg <= 0.5) return "";
    if(deg >= 359.5) return fullCirclePath(r);
    var p0 = polarXY(0, r);
    var p1 = polarXY(deg, r);
    var largeArc = deg > 180 ? 1 : 0;
    return "M100,100 L" + p0.x.toFixed(2) + "," + p0.y.toFixed(2) +
      " A" + r + "," + r + " 0 " + largeArc + " 1 " +
      p1.x.toFixed(2) + "," + p1.y.toFixed(2) + " Z";
  }
  function setPieSector(frac, color){
    pieSector.setAttribute("fill", color);
    pieSector.setAttribute("d", pieWedgeD(frac, FACE_R));
  }

  // The seconds digit is drawn twice, clipped like a clock hand: the swept portion (already
  // passed by the colored wedge) shows in the background color, the unswept portion shows in
  // the phase color — same two-tone technique as the breathing water digit, but with a radial
  // wedge clip instead of a rising waterline.
  function setDigitClip(frac){
    var wedge = pieWedgeD(frac, FACE_R);
    clockSweptClipPathEl.setAttribute("d", wedge);
    clockUnsweptClipPathEl.setAttribute("d", fullCirclePath(FACE_R) + " " + wedge);
  }

  // Thin stroked arc: the ELAPSED portion of the outer session ring, growing clockwise from top.
  function setSessionArc(frac){
    frac = Math.max(0, Math.min(1, frac));
    var endDeg = frac * 360;
    if(endDeg <= 0.5){
      sessionArc.setAttribute("d", "");
    } else if(endDeg >= 359.5){
      sessionArc.setAttribute("d", fullCirclePath(SESSION_R));
    } else {
      var p0 = polarXY(0, SESSION_R);
      var p1 = polarXY(endDeg, SESSION_R);
      var largeArc = endDeg > 180 ? 1 : 0;
      sessionArc.setAttribute("d",
        "M" + p0.x.toFixed(2) + "," + p0.y.toFixed(2) +
        " A" + SESSION_R + "," + SESSION_R + " 0 " + largeArc + " 1 " +
        p1.x.toFixed(2) + "," + p1.y.toFixed(2));
    }
    var dot = polarXY(endDeg, SESSION_R);
    sessionDot.setAttribute("cx", dot.x.toFixed(2));
    sessionDot.setAttribute("cy", dot.y.toFixed(2));
  }

  // Static bezel: 60 small dots every 6°, purely decorative (dive-watch style).
  function buildMinorTicks(){
    minorTicksG.innerHTML = "";
    var frag = document.createDocumentFragment();
    var r = (MINOR_R_IN + MINOR_R_OUT) / 2;
    for(var i = 0; i < 60; i++){
      var p = polarXY(i * 6, r);
      var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      dot.setAttribute("cx", p.x.toFixed(2));
      dot.setAttribute("cy", p.y.toFixed(2));
      dot.setAttribute("r", "1.1");
      dot.setAttribute("class", "minor-dot");
      frag.appendChild(dot);
    }
    minorTicksG.appendChild(frag);
  }
  buildMinorTicks();

  // 12 minute markers around the dial, clock-style. Each is a plain white dot, except the
  // position for the most recently completed minute, which shows that minute's number instead.
  function renderPosMarks(minuteCount, color){
    posMarksG.innerHTML = "";
    var frag = document.createDocumentFragment();
    var activePos = minuteCount > 0 ? (minuteCount - 1) % 12 : -1;
    for(var i = 0; i < 12; i++){
      var p = polarXY(i * 30, POS_R);
      if(i === activePos){
        var text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", p.x.toFixed(2));
        text.setAttribute("y", (p.y + 4).toFixed(2));
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("font-size", "15");
        text.setAttribute("class", "pos-num");
        text.setAttribute("fill", color);
        text.textContent = String(minuteCount);
        frag.appendChild(text);
      } else {
        var dot = document.createElementNS("http://www.w3.org/2000/svg", "circle");
        dot.setAttribute("cx", p.x.toFixed(2));
        dot.setAttribute("cy", p.y.toFixed(2));
        dot.setAttribute("r", "2.6");
        dot.setAttribute("class", "pos-dot");
        frag.appendChild(dot);
      }
    }
    posMarksG.appendChild(frag);
  }

  function setWaterLevel(level){
    // level: 0 = empty, 1 = full. Surface sits at y = (100+MAX_R) - level*(2*MAX_R)
    var y = (100 + MAX_R) - level * (2 * MAX_R);
    waterY.setAttribute("transform", "translate(0," + y.toFixed(1) + ")");
    aboveRect.setAttribute("height", y.toFixed(1));
    belowRect.setAttribute("y", y.toFixed(1));
    belowRect.setAttribute("height", (200 - y).toFixed(1));
  }

  function setBreathDigit(text){
    digitAbove.textContent = text;
    digitBelow.textContent = text;
  }

  // ---------- render setup screen ----------
  var chronoOn = false;
  var chronoEl = document.getElementById("chrono");
  function showChrono(on){

    chronoEl.classList.toggle("active", on);
    if(on){
      setupEl.classList.add("hidden");
      runEl.classList.remove("active");

    }
  }

  // fond photo : uniquement sur les écrans d'accueil (liste + réglages) de respiration / O2 / CO2 ;
  // bleu nuit pendant la séance (dès « Démarrer »), à la fin, et sur HIIT / Chrono
  function applyBg(){
    var inSession = runEl.classList.contains("active") || doneEl.classList.contains("active");
    var poolTab = !chronoOn && (state.protocol === "carre" || state.protocol === "o2" || state.protocol === "co2");
    document.body.setAttribute("data-bg", (poolTab && !inSession) ? "pool" : "navy");
  }

  function renderTabs(){
    Array.prototype.forEach.call(tabsEl.children, function(btn){

    });

  function totalDuration(protoKey, cfg){
    var seq = PROTOCOLS[protoKey].build(cfg);
    var total = PROTOCOLS[protoKey].kind === "apnea" ? 0 : PREPARE_SEC;
    seq.forEach(function(p){ total += p.dur; });
    return total;
  }

  function defaultsFor(key){
    var c = {};
    PROTOCOLS[key].fields.forEach(function(f){ c[f.key] = f.default; });
    return c;
  }
  function persistPresets(){ saveJSON("scc_presets", state.presets); }

  function renderSetup(){
    var key = state.protocol;
    var proto = PROTOCOLS[key];
    var list = state.presets[key] || (state.presets[key] = []);
    setupEl.innerHTML = "";

    // ----- liste : séances enregistrées + bouton + -----
    if(state.view === "list"){
      var col = document.createElement("div");
      col.className = "presets";
      list.forEach(function(pr, i){
        var row = document.createElement("div");
        row.className = "preset-row";
        var open = document.createElement("button");
        open.type = "button"; open.className = "preset-open"; open.textContent = pr.name;
        open.addEventListener("click", function(){
          state.cur = i;
          state.configs[key] = JSON.parse(JSON.stringify(pr.cfg));
          saveJSON("scc_configs", state.configs);
          state.view = "edit"; renderSetup();
        });
        var del = document.createElement("button");
        del.type = "button"; del.className = "preset-del"; del.textContent = "✕";
        del.setAttribute("aria-label","Supprimer "+pr.name);
        del.addEventListener("click", function(){
          list.splice(i,1); persistPresets(); renderSetup();
        });
        row.appendChild(open); row.appendChild(del);
        col.appendChild(row);
      });
      var add = document.createElement("button");
      add.type = "button"; add.className = "plus-btn"; add.textContent = "+";
      add.setAttribute("aria-label","Nouvelle séance");
      add.addEventListener("click", function(){
        state.configs[key] = defaultsFor(key);
        state.cur = -1; state.view = "new"; renderSetup();
      });
      col.appendChild(add);
      setupEl.appendChild(col);
      return;
    }

    // ----- barre du haut : retour (+ nom) -----
    var top = document.createElement("div");
    top.className = "setup-top";
    var back = document.createElement("button");
    back.type = "button"; back.className = "back-link"; back.textContent = "‹ Séances";
    back.addEventListener("click", function(){ state.view = "list"; renderSetup(); });
    top.appendChild(back);
    var nameInp = null;
    if(state.view === "new"){
      nameInp = document.createElement("input");
      nameInp.type = "text"; nameInp.maxLength = 24; nameInp.placeholder = "Nom de la séance";
      nameInp.className = "name-inp"; nameInp.setAttribute("aria-label","Nom de la séance");
    } else {
      var ttl = document.createElement("div");
      ttl.className = "setup-name"; ttl.textContent = list[state.cur] ? list[state.cur].name : "";
      top.appendChild(ttl);
    }
    setupEl.appendChild(top);
    if(nameInp) setupEl.appendChild(nameInp);

    var group = document.createElement("div");
    group.className = "field-group";
    proto.fields.forEach(function(f){
      var row = document.createElement("div");
      row.className = "field";
      row.innerHTML =
        '<div><div class="field-label">'+f.label+'</div><div class="field-hint">'+f.hint+'</div></div>' +
        '<div class="stepper">' +
          '<button type="button" data-act="dec" data-key="'+f.key+'">–</button>' +
          '<div class="val mono" data-val="'+f.key+'"></div>' +
          '<button type="button" data-act="inc" data-key="'+f.key+'">+</button>' +
        '</div>';
      group.appendChild(row);
    });
    setupEl.appendChild(group);

    var preview = document.createElement("div");
    preview.className = "preview";
    preview.id = "previewLine";
    setupEl.appendChild(preview);

    var startBtn = document.createElement("button");
    startBtn.className = "start-btn";
    startBtn.id = "startBtn";
    if(state.view === "new"){
      startBtn.textContent = "Enregistrer";
      startBtn.addEventListener("click", function(){
        var name = nameInp.value.trim();
        if(!name){ nameInp.focus(); return; }
        list.push({name:name, cfg:JSON.parse(JSON.stringify(state.configs[key]))});
        persistPresets();
        state.cur = list.length-1; state.view = "edit"; renderSetup();
      });
    } else {
      startBtn.textContent = "Démarrer";
      startBtn.addEventListener("click", startSession);
    }
    setupEl.appendChild(startBtn);

    updateValues();
  }

  setupEl.addEventListener("click", function(e){
    var btn = e.target.closest("button[data-act]");
    if(!btn) return;
    var key = btn.dataset.key;
    var proto = PROTOCOLS[state.protocol];
    var f = proto.fields.find(function(ff){ return ff.key===key; });
    var cfgNow = state.configs[state.protocol];
    var delta = btn.dataset.act === "inc" ? f.step : -f.step;
    cfgNow[key] = Math.min(f.max, Math.max(f.min, cfgNow[key] + delta));
    saveJSON("scc_configs", state.configs);
    if(state.view === "edit" && state.presets[state.protocol] && state.presets[state.protocol][state.cur]){
      state.presets[state.protocol][state.cur].cfg = JSON.parse(JSON.stringify(cfgNow));
      persistPresets();
    }
    updateValues();
  }, {passive:true});


  function updateValues(){
    var proto = PROTOCOLS[state.protocol];
    var cfg = state.configs[state.protocol];
    proto.fields.forEach(function(f){
      var el = setupEl.querySelector('[data-val="'+f.key+'"]');
      if(!el) return;
      el.textContent = f.isRounds ? cfg[f.key] : fmt(cfg[f.key]);
    });
    var total = totalDuration(state.protocol, cfg);
    var line = document.getElementById("previewLine");
    if(line){
      line.innerHTML = 'Durée totale estimée <b>'+fmt(total)+'</b>';
    }
  }

  // ---------- session control ----------
  function startSession(){
    var proto = PROTOCOLS[state.protocol];
    var cfg = state.configs[state.protocol];
    var built = proto.build(cfg);
    state.sequence = (proto.kind === "apnea") ? built : [{type:"prepare", dur:PREPARE_SEC, round:0}].concat(built);
    state.totalRounds = cfg.rounds;
    state.idx = -1;
    state.sessionStart = performance.now();
    state.sessionTotal = 0;
    state.sequence.forEach(function(p){ state.sessionTotal += p.dur; });
    setupEl.classList.add("hidden");
    runEl.classList.add("active");
    doneEl.classList.remove("active");
    requestWake();
    getCtx(); // unlock audio on user gesture
    loadVoiceBuffers();
    advancePhase();
    state.running = true;
    pauseBtn.textContent = "Stop";
    loop();
  }

  function advancePhase(){
    var prevPh = state.sequence[state.idx];
    if(prevPh && prevPh.type === "hold" && PROTOCOLS[state.protocol].kind === "apnea") playVoice("respirez");
    state.idx++;
    if(state.idx >= state.sequence.length){
      finishSession();
      return;
    }
    var ph = state.sequence[state.idx];
    var proto = PROTOCOLS[state.protocol];
    state.phaseDur = ph.dur;
    state.phaseStart = performance.now();
    state.remaining = ph.dur;
    state.beepedAt = {};
    state.beepedMinutes = {};
    if(proto.kind === "apnea" && ph.type === "hold"){
      playVoice("top");
    }
    transitionBeep();
    renderPhase();
  }

  function phaseDisplayName(proto, type){
    if(type === "prepare") return "Prêt";
    if(type === "recovery") return "Récupération";
    if(proto.kind === "breath") return BREATH_LABELS[type];
    return type === "hold" ? proto.holdLabel.charAt(0)+proto.holdLabel.slice(1).toLowerCase() : "Repos";
  }

  function renderPhase(){
    var ph = state.sequence[state.idx];
    var proto = PROTOCOLS[state.protocol];
    var isBreath = proto.kind === "breath";

    var isWater = isBreath;
    var label;
    if(ph.type === "prepare") label = "PRÊT";
    else if(isBreath) label = BREATH_LABELS[ph.type];
    else if(ph.type === "breathPrep") label = BREATH_LABELS.breathPrep;
    else if(ph.type === "recovery") label = "RÉCUPÉRATION";
    else if(ph.type === "hold") label = proto.holdLabel;
    else label = "REPOS";
    var timerColor = isBreath ? ((ph.type === "in") ? "var(--rest)" : (ph.type === "out") ? "var(--ready)" : "#FFFFFF") : PHASE_COLORS[ph.type];

    breathPhaseLabel.hidden = false;
    breathPhaseLabel.textContent = label;
    breathPhaseLabel.style.color = timerColor;

    clockSvg.style.display = isWater ? "none" : "";
    breathSvg.style.display = isWater ? "" : "none";
    if(isWater) waterFill.setAttribute("fill", PHASE_COLORS[ph.type]);
    var useTwoToneLabel = proto.kind !== "cardio";
    phaseUnit.hidden = useTwoToneLabel;
    phaseUnit.textContent = "secondes";
    if(!isWater){
      setPieSector(0, PHASE_COLORS[ph.type]);
      pieSector.style.opacity = "1";
      clockDigitFadeEl.style.opacity = "1";
      posMarksG.style.opacity = "1";
      clockSecGroupEl.style.display = useTwoToneLabel ? "" : "none";
      renderPosMarks(0, PHASE_COLORS[ph.type]);
      digitUnsweptEl.setAttribute("fill", PHASE_COLORS[ph.type]);
      secLabelUnsweptEl.setAttribute("fill", PHASE_COLORS[ph.type]);
      var isCountUp = proto.kind === "apnea" && ph.type === "hold";
      var initialSec = String(isCountUp ? 0 : Math.ceil(Math.min(ph.dur, 60)));
      digitUnsweptEl.textContent = initialSec;
      digitSweptEl.textContent = initialSec;
      setDigitClip(0);
      state.lastMinuteCount = 0;
    } else {
      var startLevel = (ph.type === "holdFull") ? 1 : (ph.type === "in" || ph.type === "holdEmpty") ? 0 : 1;
      setWaterLevel(startLevel);
      setBreathDigit(String(Math.ceil(ph.dur)));
    }

    phaseUnit.style.color = timerColor;
    phaseUnit.style.opacity = "0.85";
    if(isWater){
      digitAbove.style.fill = timerColor;
      secLabelAboveEl.style.fill = timerColor;
      // Retention phases (full or empty lungs) show a solid white digit rather than the
      // two-tone waterline split used for inspiration/expiration.
      var isRetention = (ph.type === "holdFull" || ph.type === "holdEmpty");
      digitBelow.style.fill = isRetention ? timerColor : "#0A0D12";
      secLabelBelowEl.style.fill = isRetention ? timerColor : "#0A0D12";
    }

    if(ph.type === "prepare"){
      roundBadge.textContent = "PRÉPARATION";
    } else if(ph.type === "breathPrep" || ph.type === "recovery"){
      roundBadge.textContent = "\u00a0";
    } else {
      roundBadge.textContent = (isBreath ? "CYCLE " : "ROUND ") + ph.round + " / " + state.totalRounds;
    }

    var next = state.sequence[state.idx+1];
    if(next){
      nextUp.textContent = "Ensuite : " + phaseDisplayName(proto, next.type) + " · " + fmt(next.dur);
    } else {
      nextUp.textContent = "Dernière étape";
    }
  }

  function loop(){
    if(!state.running) return;
    var ph = state.sequence[state.idx];
    var proto = PROTOCOLS[state.protocol];
    var next = state.sequence[state.idx+1];
    var elapsed = (performance.now() - state.phaseStart) / 1000;
    var remaining = Math.max(0, ph.dur - elapsed);
    state.remaining = remaining;

    var frac = ph.dur > 0 ? (ph.dur - remaining) / ph.dur : 1;
    var isWater = proto.kind === "breath";

    if(isWater){
      setBreathDigit(String(Math.ceil(remaining)));

      var level; // 0 = empty, 1 = full
      if(ph.type === "in") level = frac;
      else if(ph.type === "holdFull") level = 1;
      else if(ph.type === "out") level = 1 - frac;
      else if(ph.type === "breathPrep") level = frac;
      else level = 0; // holdEmpty

      setWaterLevel(level);
    } else {
      // Dial logic: a phase of 60s or less fills over its own full duration; a longer phase
      // loops every 60s and advances the minute markers each time a lap completes.
      var isCountUp = proto.kind === "apnea" && ph.type === "hold";
      var lapFrac, digitSec, minuteCount, lapElapsedMs, lapTotalMs;
      if(ph.dur <= 60){
        lapFrac = ph.dur > 0 ? elapsed / ph.dur : 1;
        digitSec = isCountUp ? Math.floor(elapsed) : Math.ceil(remaining);
        minuteCount = 0;
        lapElapsedMs = elapsed * 1000;
        lapTotalMs = ph.dur * 1000;
      } else {
        var mod = elapsed % 60;
        lapFrac = mod / 60;
        digitSec = isCountUp ? Math.floor(mod) : Math.ceil(Math.min(remaining, 60 - mod));
        minuteCount = Math.floor(elapsed / 60);
        lapElapsedMs = mod * 1000;
        lapTotalMs = 60000;
      }
      lapFrac = Math.max(0, Math.min(1, lapFrac));

      setPieSector(lapFrac, PHASE_COLORS[ph.type]);

      // Cross-fade opacity across a lap boundary instead of letting the wedge/digit
      // pop back to their start state in one frame.
      var FADE_MS = 160;
      var fadeOpacity = 1;
      if(lapElapsedMs < FADE_MS) fadeOpacity = lapElapsedMs / FADE_MS;
      else if((lapTotalMs - lapElapsedMs) < FADE_MS) fadeOpacity = (lapTotalMs - lapElapsedMs) / FADE_MS;
      fadeOpacity = Math.max(0, Math.min(1, fadeOpacity)).toFixed(2);
      pieSector.style.opacity = fadeOpacity;
      clockDigitFadeEl.style.opacity = fadeOpacity;
      posMarksG.style.opacity = fadeOpacity;

      var digitStr = String(digitSec);
      digitUnsweptEl.textContent = digitStr;
      digitSweptEl.textContent = digitStr;
      setDigitClip(lapFrac);

      if(minuteCount !== state.lastMinuteCount){
        renderPosMarks(minuteCount, PHASE_COLORS[ph.type]);
        if(minuteCount > 0 && proto.kind === "apnea" && ph.type === "hold") minuteBeep();
        state.lastMinuteCount = minuteCount;
      }

      if(state.sessionTotal > 0){
        var sessionElapsed = (performance.now() - state.sessionStart) / 1000;
        setSessionArc(sessionElapsed / state.sessionTotal);
      }
    }

    var rem = Math.ceil(remaining);
    var isApnea = proto.kind === "apnea";
    var leadsIntoHold = next && next.type === "hold";

    if(proto.kind === "breath"){
      // no per-second tick in breath mode — only the phase-change beep (advancePhase) plays
    } else if(isApnea && ph.type !== "hold" && leadsIntoHold){
      // voice countdown into an apnea hold: 30, 20, 10, then 5-1
      var vAt = [30, 10, 5, 4, 3, 2, 1];
      for(var vi = 0; vi < vAt.length; vi++){
        var vv = vAt[vi], vk = "v" + vv;
        // le mot démarre exactement quand le chiffre affiché passe à vv
        if(!state.beepedAt[vk] && remaining <= vv + VOICE_LEAD && remaining > vv - 1){
          state.beepedAt[vk] = true;
          playVoice(String(vv));
        }
      }
    } else if(isApnea && ph.type === "hold"){
      // minute beep now handled centrally above, alongside the dial's minute markers
    } else {
      if(rem <= 3 && rem >= 1 && !state.beepedAt[rem]){
        state.beepedAt[rem] = true;
        tickBeep();
      }
    }

    if(remaining <= 0){
      advancePhase();
      if(state.running) state.raf = requestAnimationFrame(loop);
    } else {
      state.raf = requestAnimationFrame(loop);
    }
  }

  function finishSession(){
    state.running = false;
    releaseWake();
    runEl.classList.remove("active");
    doneEl.classList.add("active");
    var proto = PROTOCOLS[state.protocol];
    doneSummary.textContent = proto.name + " · " + state.totalRounds + " rounds complétés";
    var isCarre = state.protocol === "carre";
    document.getElementById("doneLogo").style.display = isCarre ? "block" : "none";
    var isO2 = state.protocol === "o2";
    document.getElementById("doneO2").style.display = isO2 ? "block" : "none";
    var isCO2 = state.protocol === "co2";
    document.getElementById("doneCO2").style.display = isCO2 ? "block" : "none";
    document.getElementById("doneDiver").style.display = (isCarre || isO2 || isCO2) ? "none" : "block";
    document.getElementById("doneTitle").style.display = "";
    beep(660, 0.15, 0, 0.2);
    beep(880, 0.2, 0.18, 0.22);
    beep(1100, 0.3, 0.38, 0.24);
    buzz([120, 80, 120, 80, 250]);
  }

  function stopSession(){
    state.running = false;
    if(state.raf) cancelAnimationFrame(state.raf);
    releaseWake();
    stopVoices(); if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); }catch(e){} }
    runEl.classList.remove("active");
    setupEl.classList.remove("hidden");
  }

  function togglePause(){
    if(state.running){
      state.running = false;
      state.pausedAt = performance.now();
      if(state.raf) cancelAnimationFrame(state.raf);
      pauseBtn.textContent = "Réinitialiser";
      releaseWake();
      stopVoices(); if("speechSynthesis" in window){ try{ speechSynthesis.cancel(); }catch(e){} }
    } else {
      // resume: shift phaseStart (and sessionStart) so elapsed/remaining time is preserved
      state.phaseStart = performance.now() - (state.phaseDur - state.remaining)*1000;
      if(state.pausedAt){
        state.sessionStart += (performance.now() - state.pausedAt);
      }
      state.running = true;
      pauseBtn.textContent = "Pause";
      requestWake();
      loop();
    }
  }

  function skipPhase(){
    if(state.raf) cancelAnimationFrame(state.raf);
    advancePhase();
    if(state.running) loop();
  }

  // ---------- events ----------
  tabsEl.addEventListener("click", function(e){
    var btn = e.target.closest(".tab");
    if(!btn) return;
    if(btn.dataset.protocol === "chrono"){
      if(runEl.classList.contains("active")) stopSession();
      showChrono(true);
      renderTabs();
      return;
    }
    if(chronoOn) showChrono(false);
    if(runEl.classList.contains("active")) stopSession();   // exercice en cours : on réinitialise
    state.protocol = btn.dataset.protocol;
    state.view = "list"; state.cur = -1;
    saveJSON("scc_lastProtocol", state.protocol);
    renderTabs();
    renderSetup();
  });

  pauseBtn.addEventListener("click", function(){
    if(state.running) togglePause();   // Stop : fige la séance
    else stopSession();                // Réinitialiser : retour au réglage
  });
  doneBackBtn.addEventListener("click", function(){
    doneEl.classList.remove("active");
    setupEl.classList.remove("hidden");
  });

  // ---------- init ----------
  try{
    var bgObs = new MutationObserver(applyBg);
    bgObs.observe(runEl, {attributes:true, attributeFilter:["class"]});
    bgObs.observe(doneEl, {attributes:true, attributeFilter:["class"]});
  }catch(e){}
  renderTabs();
  renderSetup();
})();
</script>

<script>
(function(){
  "use strict";
  var CX=200, CY=200;
  var BLUE=[53,167,255], WHITE=[242,244,247], GRAY=[92,100,112];

  function polar(cx,cy,r,deg){
    var a=deg*Math.PI/180;
    return [cx+r*Math.sin(a), cy-r*Math.cos(a)];
  }
  function tick(r1,r2,deg,cls){
    var p1=polar(CX,CY,r1,deg), p2=polar(CX,CY,r2,deg);
    return '<line class="'+cls+'" x1="'+p1[0].toFixed(2)+'" y1="'+p1[1].toFixed(2)+'" x2="'+p2[0].toFixed(2)+'" y2="'+p2[1].toFixed(2)+'"/>';
  }
  function mix(a,b,f){
    return "rgb("+Math.round(a[0]+(b[0]-a[0])*f)+","+Math.round(a[1]+(b[1]-a[1])*f)+","+Math.round(a[2]+(b[2]-a[2])*f)+")";
  }

  // 240 graduations (quart de seconde), une par seconde plus longue, une blanche toutes les 5 s.
  var t="", i, tickAngles=[], tickBases=[];
  for(i=0;i<240;i++){
    var deg=i*1.5;
    tickAngles.push(deg);
    if(i%20===0){ t+=tick(192,172,deg,"chr-t-major"); tickBases.push(WHITE); }
    else if(i%4===0){ t+=tick(192,178,deg,"chr-t-sec"); tickBases.push(GRAY); }
    else{ t+=tick(192,184,deg,"chr-t-fine"); tickBases.push(GRAY); }
  }
  document.getElementById("chrTicks").innerHTML=t;

  // Chiffres rangés par angle : 60 en haut, puis 5, 10 ... 55. Un second jeu, bleu, est découpé par l'aiguille.
  var n="";
  for(i=0;i<12;i++){
    var ang=i*30, p=polar(CX,CY,146,ang);
    n+='<text class="chr-n-main" x="'+p[0].toFixed(2)+'" y="'+p[1].toFixed(2)+'" dy=".35em">'+(i===0?60:i*5)+'</text>';
  }
  document.getElementById("chrNums").innerHTML=n;
  document.getElementById("chrNumsBlue").innerHTML=n;

  var tickEls=[].slice.call(document.querySelectorAll("#chrTicks line"));
  function makeSweep(els,angles,bases,prop,lead,span){
    var doneIdx=0, startedIdx=0;
    function f(k,angle){ return Math.max(0,Math.min(1,(angle-(angles[k]-lead))/span)); }
    return {
      reset:function(){
        for(var k=0;k<startedIdx;k++){ els[k].style[prop]=""; }
        doneIdx=0; startedIdx=0;
      },
      update:function(angle){
        while(startedIdx<els.length && f(startedIdx,angle)>0){ startedIdx++; }
        for(var k=doneIdx;k<startedIdx;k++){
          els[k].style[prop]=mix(bases[k],BLUE,f(k,angle));
        }
        while(doneIdx<startedIdx && f(doneIdx,angle)>=1){ doneIdx++; }
      }
    };
  }
  var tickSweep=makeSweep(tickEls,tickAngles,tickBases,"stroke",4.5,9);

  // Repères de minutes : 12 points blancs, la minute écoulée la plus récente devient un chiffre jaune gras.
  var minEl=document.getElementById("chrMinMarks");
  var lastMin=-1;
  function renderMinMarks(m){
    if(m===lastMin) return;
    lastMin=m;
    var s="", idx, q;
    var active=m>0 ? (m-1)%12 : -1;
    for(idx=0;idx<12;idx++){
      q=polar(CX,CY,100,idx*30);
      if(idx===active){
        s+='<text class="chr-min-num" x="'+q[0].toFixed(2)+'" y="'+q[1].toFixed(2)+'" dy=".35em">'+m+'</text>';
      }else{
        s+='<circle class="chr-min-dot" cx="'+q[0].toFixed(2)+'" cy="'+q[1].toFixed(2)+'" r="2.8"/>';
      }
    }
    minEl.innerHTML=s;
  }

  // ---------- état ----------
  var running=false, stopped=false, startTs=0, elapsedMs=0, lastAngle=0, raf=null, wake=null;
  function nowElapsed(){ return running ? performance.now()-startTs : elapsedMs; }

  var sweepPath=document.getElementById("chrSweepPath");
  function wedge(angle){
    if(angle<=0.3) return "";
    if(angle>=359.5) return "M200,0 A200,200 0 1 1 200,400 A200,200 0 1 1 200,0 Z";
    var p0=polar(CX,CY,200,0), p1=polar(CX,CY,200,angle);
    return "M"+CX+","+CY+" L"+p0[0].toFixed(2)+","+p0[1].toFixed(2)+" A200,200 0 "+(angle>180?1:0)+" 1 "+p1[0].toFixed(2)+","+p1[1].toFixed(2)+" Z";
  }

  var handEl=document.getElementById("chrHand");
  var goBtn=document.getElementById("chrGoBtn");
  var resultEl=document.getElementById("chrResult");
  var bestEl=document.getElementById("chrBest");

  function fmtSeconds(ms){
    var total=Math.floor(ms/1000);
    var h=Math.floor(total/3600), m=Math.floor(total/60)%60, sec=total%60;
    function two(x){ return x<10 ? "0"+x : String(x); }
    return (h>0 ? h+":" : "")+two(m)+":"+two(sec);
  }

  // Record : le temps le plus long, mémorisé avec sa date.
  var BEST_KEY="chrono-record";
  var best=null;
  try{ var raw=localStorage.getItem(BEST_KEY); if(raw){ best=JSON.parse(raw); } }catch(e){ best=null; }
  function fmtDate(iso){
    try{ return new Date(iso).toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"}); }
    catch(e){ return iso; }
  }
  var editBtn=document.getElementById("chrEditBtn");
  function renderBest(){
    bestEl.innerHTML=best ? 'Record <strong class="chr-rec">'+fmtSeconds(best.ms)+"</strong> · "+fmtDate(best.date) : "Aucun record enregistré";
    editBtn.textContent=best ? "Modifier" : "Définir";
  }
  function persistBest(){
    try{ localStorage.setItem(BEST_KEY,JSON.stringify(best)); }catch(e){}
  }
  function saveBest(ms){
    if(Math.floor(ms/1000)<1) return;
    if(!best || Math.floor(ms/1000)>Math.floor(best.ms/1000)){
      best={ms:ms,date:new Date().toISOString()};
      persistBest();
      renderBest();
    }
  }

  function paint(){
    var e=nowElapsed();
    var angle=(e%60000)/60000*360;
    handEl.setAttribute("transform","rotate("+angle.toFixed(2)+" "+CX+" "+CY+")");
    if(e<=0){
      tickSweep.reset(); lastAngle=0;
      sweepPath.setAttribute("d","");
    }else{
      if(angle<lastAngle-180){ tickSweep.reset(); }
      tickSweep.update(angle);
      lastAngle=angle;
      sweepPath.setAttribute("d",wedge(angle));
    }
    renderMinMarks(Math.floor(e/60000));
  }
  function loop(){
    paint();
    if(running){ raf=requestAnimationFrame(loop); }
  }

  function requestWake(){
    try{
      if("wakeLock" in navigator){
        navigator.wakeLock.request("screen").then(function(w){ wake=w; }).catch(function(){});
      }
    }catch(e){}
  }
  function releaseWake(){
    try{ if(wake){ wake.release(); wake=null; } }catch(e){}
  }

  // ---------- bips sonores : intervalle régulier et/ou temps précis ----------
  var BIPS_KEY="chrono-bips";
  var bips={times:[]};
  try{
    var rb=localStorage.getItem(BIPS_KEY);
    if(rb){
      var ob=JSON.parse(rb);
      if(ob){
                bips.times=(ob.times||[]).map(Number).filter(function(x){ return x>=1; });
      }
    }
  }catch(e){}
  function saveBips(){ try{ localStorage.setItem(BIPS_KEY,JSON.stringify(bips)); }catch(e){} }

  var actx=null;
  function getCtx(){
    if(!actx){
      try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
    }
    if(actx && actx.state==="suspended"){ try{ actx.resume(); }catch(e){} }
    return actx;
  }
  // Même son « Très grave » que dans le reste de l'appli : sinus 440 Hz, extinction exponentielle.
  function beep(){
    var c=getCtx();
    if(c){
      var t0=c.currentTime, osc=c.createOscillator(), g=c.createGain();
      osc.type="sine"; osc.frequency.value=440;
      g.gain.setValueAtTime(0,t0);
      g.gain.linearRampToValueAtTime(0.24,t0+0.025);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+0.28);
      osc.connect(g); g.connect(c.destination);
      osc.start(t0); osc.stop(t0+0.3);
    }
    try{ if(navigator.vibrate) navigator.vibrate(150); }catch(e){}
  }

  var lastBeepMs=0, beepTimer=null;
  function checkBeeps(){
    if(!running) return;
    var e=nowElapsed(), prev=lastBeepMs, fire=false, k;
    lastBeepMs=e;
    for(k=0;k<bips.times.length;k++){
      var T=bips.times[k]*1000;
      if(prev<T && e>=T) fire=true;
    }
    if(fire) beep();
  }
  function startBeeps(){
    getCtx();
    lastBeepMs=0;
    if(beepTimer) clearInterval(beepTimer);
    beepTimer=setInterval(checkBeeps,50);
  }
  function stopBeeps(){
    if(beepTimer){ clearInterval(beepTimer); beepTimer=null; }
  }

  var chipsEl=document.getElementById("chrChips");
  var addMin=document.getElementById("chrAddMin");
  var addSec=document.getElementById("chrAddSec");

  function renderBips(){
    chipsEl.innerHTML="";
    bips.times.forEach(function(x){
      var b=document.createElement("button");
      b.type="button";
      b.className="chr-chip";
      b.setAttribute("aria-label","Supprimer le bip à "+fmtSeconds(x*1000));
      b.textContent=fmtSeconds(x*1000)+" ✕";
      b.addEventListener("click",function(){
        bips.times=bips.times.filter(function(y){ return y!==x; });
        saveBips(); renderBips();
      });
      chipsEl.appendChild(b);
    });
  }
  document.getElementById("chrAddBtn").addEventListener("click",function(){
    var m=parseInt(addMin.value,10)||0, sc=parseInt(addSec.value,10)||0;
    var total=m*60+sc;
    if(sc<0 || sc>59 || total<1){ (total<1 ? addMin : addSec).focus(); return; }
    if(bips.times.indexOf(total)===-1 && bips.times.length<30){
      bips.times.push(total);
      bips.times.sort(function(a,b){ return a-b; });
      saveBips();
    }
    addMin.value=""; addSec.value="";
    renderBips();
  });
  renderBips();

  // GO démarre, STOP fige et enregistre, RÉINITIALISER remet tout à zéro.
  goBtn.addEventListener("click",function(){
    if(running){
      elapsedMs=performance.now()-startTs;
      running=false;
      if(raf){ cancelAnimationFrame(raf); raf=null; }
      releaseWake();
      stopBeeps();
      stopped=true;
      goBtn.textContent="RÉINITIALISER"; goBtn.className="chr-btn chr-reset";
      resultEl.textContent=fmtSeconds(elapsedMs);
      saveBest(elapsedMs);
      paint();
    }else if(stopped){
      stopped=false;
      elapsedMs=0;
      resultEl.textContent="";
      goBtn.textContent="GO"; goBtn.className="chr-btn chr-go";
      paint();
    }else{
      elapsedMs=0;
      startTs=performance.now();
      running=true;
      requestWake();
      startBeeps();
      goBtn.textContent="STOP"; goBtn.className="chr-btn chr-stop";
      resultEl.textContent="";
      raf=requestAnimationFrame(loop);
    }
  });

  // Saisie manuelle du record : il est ensuite dépassé automatiquement par tout meilleur résultat.
  var editEl=document.getElementById("chrEdit");
  var minIn=document.getElementById("chrMin");
  var secIn=document.getElementById("chrSec");
  var dateIn=document.getElementById("chrDate");
  function p2(x){ return x<10 ? "0"+x : String(x); }
  function dateStr(d){ return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
  editBtn.addEventListener("click",function(){
    if(!editEl.hidden){ editEl.hidden=true; return; }
    if(best){
      var total=Math.floor(best.ms/1000);
      minIn.value=Math.floor(total/60);
      secIn.value=total%60;
      dateIn.value=dateStr(new Date(best.date));
    }else{
      minIn.value=""; secIn.value=""; dateIn.value=dateStr(new Date());
    }
    editEl.hidden=false;
  });
  document.getElementById("chrCancel").addEventListener("click",function(){ editEl.hidden=true; });
  document.getElementById("chrSave").addEventListener("click",function(){
    var m=parseInt(minIn.value,10)||0, sc=parseInt(secIn.value,10)||0;
    if(m<0 || sc<0 || sc>59){ secIn.focus(); return; }
    var total=m*60+sc;
    if(total<1){ minIn.focus(); return; }
    var d=dateIn.value ? new Date(dateIn.value+"T12:00:00") : new Date();
    if(isNaN(d.getTime())){ d=new Date(); }
    best={ms:total*1000,date:d.toISOString()};
    persistBest();
    renderBest();
    editEl.hidden=true;
  });

  renderBest();
  paint();
})();
</script>
